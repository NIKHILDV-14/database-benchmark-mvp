[package]
name = "embedding"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
dataset = { path = "../dataset" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1.81"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
