[experiment]
name = "text-mvp-test"
seed = 42

[dataset]
path = "./datasets/sample.jsonl"
max_size_gb = 2.0
empty_text_policy = "reject"
trim_whitespace = true

[databases.postgres]
enabled = true
host = "localhost"
port = 5433
username = "benchmark_user"
password = "benchmark_pass"
database = "benchmark_db"

[databases.mongodb]
enabled = true
host = "localhost"
port = 27017
username = "benchmark_user"
password = "benchmark_pass"
database = "benchmark_db"

[databases.qdrant]
enabled = true
host = "localhost"
port = 6334
database = "benchmark_vectors"

[databases.lancedb]
enabled = true
host = "/tmp/lancedb_benchmark"
database = "benchmark_vectors"

[embedding]
provider = "dummy"
batch_size = 32
chunk_size = 500
chunk_overlap = 50
cache_enabled = false
dimension = 128
