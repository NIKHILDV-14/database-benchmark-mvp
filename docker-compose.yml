version: '3.8'

services:
  postgres:
    image: postgres:16.2
    container_name: benchmark_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benchmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark_pass}
      POSTGRES_DB: ${POSTGRES_DB:-benchmark_db}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0.7
    container_name: benchmark_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-benchmark_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-benchmark_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-benchmark_db}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: benchmark_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  mongodb_data:
  qdrant_data:
